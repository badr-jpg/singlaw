<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafbf8" />
    <title>SingLaw — Your Singapore legal companion</title>
    <meta name="description" content="Singapore law, plainly answered and fully cited." />
    <link rel="icon" href="/singlaw-mark.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
    />
    <script>
      // Apply the saved theme before first paint to avoid a light flash.
      try {
        var t = localStorage.getItem("singlaw.theme");
        var dark = t === "dark" || ((t === null || t === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
