[project]
name = "sg-law-rag"
version = "0.1.0"
description = "Offline-capable RAG assistant for Singapore law"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "bm25s>=0.2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "numpy>=1.26",
    "einops>=0.8",
    "stripe>=16.0.0",
    "portalocker>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
python-preference = "managed"
